[workspace]
members = [
  "crates/brain-engine",
  "crates/brain-wasm",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.5.0-alpha.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/blightghp/blightghp"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
