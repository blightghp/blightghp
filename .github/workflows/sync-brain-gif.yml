name: Sincronizar GIF do cérebro

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/gen_brain_gif.js"
      - "scripts/stamp_brain_gif.js"
      - "scripts/stamp_brain_gif.test.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-brain-gif-main
  cancel-in-progress: true

jobs:
  capture:
    name: Capturar simulador e atualizar perfil
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar shell e captura
        run: npm run check
      - name: Gerar GIF do simulador
        run: npm run generate:brain-gif
      - name: Invalidar cache do README
        run: npm run stamp:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Commit sincronizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brain.gif README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): sincronizar GIF com ${GITHUB_SHA::12}"
          git push origin HEAD:main
