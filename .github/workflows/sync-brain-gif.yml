name: Sincronizar GIF do BRAIN PRO

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "!src/wasm/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/gen_brain_gif.js"
      - "scripts/brain_gif_manifest.js"
      - "scripts/brain_gif_manifest.test.js"
      - "scripts/stamp_brain_gif.js"
      - "scripts/stamp_brain_gif.test.js"
      - "scripts/verify_brain_gif.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-writers-main
  cancel-in-progress: false

jobs:
  capture:
    name: Capturar simulador e atualizar perfil
    if: github.repository == 'blightghp/blightghp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Alvo WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - name: Gerador da ABI Wasm
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Recompilar motor e ABI usados na captura
        run: npm run build:wasm
      - name: Validar shell e captura
        run: npm run check
      - name: Gerar GIF do simulador
        run: npm run generate:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Verificar artefato do perfil
        run: |
          test -s assets/brain.gif
          test "$(head -c 3 assets/brain.gif)" = "GIF"
          bytes="$(stat -c%s assets/brain.gif)"
          test "$bytes" -le 5242880
          echo "GIF validado: $bytes bytes · origem ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Invalidar cache do README
        run: npm run stamp:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Verificar proveniência do GIF e do motor
        run: npm run verify:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Atualizar branch de automação e pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/brain-gif"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brain.gif assets/brain-gif.json README.md src/wasm
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): sincronizar BRAIN PRO com ${GITHUB_SHA::12}"
          git pull --rebase origin main
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin HEAD:"refs/heads/$branch"
          else
            git push origin HEAD:"refs/heads/$branch"
          fi
          pr_url="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --base main --head "$branch" --title "chore(profile): sincronizar BRAIN PRO" --body "Artefatos do perfil gerados a partir de ${GITHUB_SHA::12}. O CI foi disparado nesta branch; revise e mescle este PR.")"
          else
            gh pr edit "$pr_url" --title "chore(profile): sincronizar BRAIN PRO" --body "Artefatos do perfil atualizados a partir de ${GITHUB_SHA::12}. O CI foi disparado nesta branch; revise e mescle este PR."
          fi
          gh workflow run ci.yml --ref "$branch"
          echo "Pull request de automação: $pr_url" >> "$GITHUB_STEP_SUMMARY"
