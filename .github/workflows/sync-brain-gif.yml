name: Sincronizar GIF do BRAIN PRO

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/gen_brain_gif.js"
      - "scripts/brain_gif_manifest.js"
      - "scripts/brain_gif_manifest.test.js"
      - "scripts/stamp_brain_gif.js"
      - "scripts/stamp_brain_gif.test.js"
      - "scripts/verify_brain_gif.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-brain-gif-main
  cancel-in-progress: true

jobs:
  capture:
    name: Capturar simulador e atualizar perfil
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Cache Rust
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: .
      - name: Alvo WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - name: Gerador da ABI Wasm
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Recompilar motor e ABI usados na captura
        run: npm run build:wasm
      - name: Validar shell e captura
        run: npm run check
      - name: Gerar GIF do simulador
        run: npm run generate:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Verificar artefato do perfil
        run: |
          test -s assets/brain.gif
          test "$(head -c 3 assets/brain.gif)" = "GIF"
          bytes="$(stat -c%s assets/brain.gif)"
          test "$bytes" -le 5242880
          echo "GIF validado: $bytes bytes · origem ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Invalidar cache do README
        run: npm run stamp:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Verificar proveniência do GIF e do motor
        run: npm run verify:brain-gif
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Commit sincronizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brain.gif assets/brain-gif.json README.md src/wasm
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): sincronizar BRAIN PRO com ${GITHUB_SHA::12}"
          git pull --rebase origin main
          git push origin HEAD:main
