name: Validar ecossistema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript · Vitest · Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify:presentation-budget
      - run: npm run verify:procedural-surface
      - run: npm run check

  rust:
    name: Rust · Tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependências do Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
      - name: Alvo WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Testes do workspace Rust
        run: cargo test --workspace
      - name: Compilação WebAssembly
        run: cargo build -p brain-wasm --release --target wasm32-unknown-unknown
      - name: Gerador da ABI Wasm
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Artefato Wasm sincronizado
        run: |
          rm -rf /tmp/brain-wasm-bindings
          wasm-bindgen target/wasm32-unknown-unknown/release/brain_wasm.wasm --out-dir /tmp/brain-wasm-bindings --target web --typescript
          diff -u src/wasm/brain_wasm.js /tmp/brain-wasm-bindings/brain_wasm.js
          diff -u src/wasm/brain_wasm.d.ts /tmp/brain-wasm-bindings/brain_wasm.d.ts
          diff -u src/wasm/brain_wasm_bg.wasm.d.ts /tmp/brain-wasm-bindings/brain_wasm_bg.wasm.d.ts
          BRAIN_WASM_DIR=/tmp/brain-wasm-bindings node scripts/shadow_replay.js
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
